<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>WatchList</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/responsive.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1ed760">

<link rel="apple-touch-icon"
href="icons/icon-192.png">

</head>

<body data-theme="dark">

<div class="background"></div>

<!-- MENU -->

<aside id="sidebar" class="sidebar glass">

<h2>Menu</h2>

<button id="allMovies">
🏠 Tutti
</button>


<button id="onlyMovies">
🎬 Film
</button>


<button id="onlySongs">
🎵 Musica
</button>


<button id="favoriteMovies">
❤️ Preferiti
</button>


<button id="settingsBtn">
⚙️ Impostazioni
</button>

</aside>

<header class="navbar glass">

<button id="menuBtn">
☰
</button>

<h1>
MyVerse
</h1>

</header>

<main>

<section class="hero">

<h2>

Le tue passioni,

<span>la tua storia.</span>

</h2>

<p id="stats">

Nessun film aggiunto

</p>

</section>

<div class="search-box glass">

<input
id="searchInput"
type="text"
placeholder="🔍 Cerca un film...">

</div>

<section
id="movieContainer"
class="movie-grid">

</section>

</main>

<!-- SCELTA TIPO -->

<div id="typeModal" class="modal hidden">

<div class="modal-box glass">

<h2>
Cosa vuoi aggiungere?
</h2>


<div class="buttons">

<button id="movieChoice">

🎬 Film

</button>


<button id="songChoice">

🎵 Canzone

</button>


</div>


</div>

</div>

<!-- MODAL film -->

<div
id="modal"
class="modal hidden">

<div class="modal-box glass">

<h2>

Aggiungi film

</h2>

<input
id="titleInput"
type="text"
placeholder="Titolo">

<label>

Copertina

</label>

<input
id="imageInput"
type="file"
accept="image/*">

<select id="whereInput">

<option value="">
Dove lo hai visto?
</option>

<option>Netflix</option>

<option>Prime Video</option>

<option>Disney+</option>

<option>Cinema</option>

<option>Altro</option>

</select>

<div
class="stars"
id="stars">

</div>

<textarea
id="noteInput"
placeholder="Nota">

</textarea>

<div class="buttons">

<button id="saveBtn">

Salva

</button>

<button id="closeBtn">

Chiudi

</button>

</div>

</div>

</div>

<!-- MODAL CANZONE -->


<div id="songModal" class="modal hidden">


<div class="modal-box glass">


<h2>

Aggiungi canzone

</h2>


<input id="songTitleInput"
placeholder="Titolo canzone">


<input id="artistInput"
placeholder="Artista">


<input id="spotifyInput"
placeholder="Link Spotify">


<div class="stars" id="songStars">

</div>


<textarea id="songNoteInput"
placeholder="Nota">

</textarea>


<div class="buttons">


<button id="saveSongBtn">

Salva

</button>


<button id="closeSongBtn">

Chiudi

</button>


</div>


</div>


</div>

<!-- IMPOSTAZIONI -->

<div
id="settingsModal"
class="modal hidden">

<div class="modal-box glass settings-box">

<h2>

⚙️ Impostazioni

</h2>

<h3>Tema</h3>

<select id="themeSelect">

<option value="dark">

🌙 Scuro

</option>

<option value="light">

☀️ Chiaro

</option>

</select>

<h3>

Layout

</h3>

<select id="layoutSelect">

<option value="grid">

Card

</option>

<option value="list">

Lista

</option>

</select>

<h3>

Ordina per

</h3>

<select id="sortSelect">

<option value="recent">

Più recenti

</option>

<option value="old">

Meno recenti

</option>

<option value="voteDesc">

Voto ↓

</option>

<option value="voteAsc">

Voto ↑

</option>

<option value="az">

A-Z

</option>

<option value="za">

Z-A

</option>

<option value="favorite">

Preferiti

</option>

</select>

<hr>

<button id="exportBtn">

💾 Esporta Backup

</button>

<input
id="importInput"
type="file"
accept=".json">

<div class="buttons">

<button id="closeSettings">

Chiudi

</button>

</div>

</div>

</div>

<button
id="addMovieBtn"
class="floating-add">

+

</button>

<footer class="footer glass">

<p>

© 2026 WatchList • Created by Matteo

</p>

</footer>

<script src="js/storage.js"></script>

<script src="js/stars.js"></script>

<script src="js/sort.js"></script>

<script src="js/settings.js"></script>

<script src="js/backup.js"></script>

<script src="js/ui.js"></script>

<script src="js/modal.js"></script>

<script src="js/app.js"></script>

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("service-worker.js");

});

}

</script>

</body>

</html>
