<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>MyVerse</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/responsive.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#050505">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="MyVerse">

<link rel="apple-touch-icon"
href="icons/icon-192.png">

</head>

<body data-theme="dark">

<div class="background"></div>

<!-- MENU -->

<aside id="sidebar" class="sidebar glass">

<h2>Menu</h2>

<button id="allMovies"><span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg> All</span></button>

<button id="onlyMovies"><span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/><line x1="3" y1="9" x2="7" y2="9"/><line x1="17" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="7" y2="15"/><line x1="17" y1="15" x2="21" y2="15"/></svg> Movies</span></button>

<button id="onlySongs"><span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Music</span></button>

<button id="onlyBooks"><span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Books</span></button>

<button id="favoriteMovies"><span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg> Favorites</span></button>

<button id="settingsBtn"><span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Settings</span></button>

<hr class="sidebar-divider">

<h3 class="sidebar-heading">Folders</h3>

<div id="folderList"></div>

<button id="newFolderBtn"><span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg> New folder</span></button>

</aside>

<header class="navbar glass">

<button id="menuBtn">☰</button>

<h1>MyVerse</h1>

</header>

<main>

<section class="hero">

<h2>
Let your passions,<br> 
<span>Become your story.</span>
</h2>

<p id="stats">
No reviews yet
</p>

</section>

<div class="search-box glass">

<span class="search-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>

<input id="searchInput" type="text" placeholder="Search your collection...">

</div>

<!-- RECOMMENDATIONS -->

<section class="recommendations">

<h2>Just for you</h2>
<p>Movies you might like</p>

<div id="recommendedContainer" class="recommended-grid"></div>

</section>

<section id="movieContainer" class="movie-grid"></section>

</main>

<!-- TYPE CHOICE -->

<div id="typeModal" class="modal hidden">

<div class="modal-box glass">

<h2>What do you want to add?</h2>

<div class="choice-grid">

<button id="movieChoice" class="choice-card">
<span><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/><line x1="3" y1="9" x2="7" y2="9"/><line x1="17" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="7" y2="15"/><line x1="17" y1="15" x2="21" y2="15"/></svg></span>
<h3>Movie</h3>
<p>Review a movie</p>
</button>

<button id="songChoice" class="choice-card">
<span><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
<h3>Music</h3>
<p>Save a song</p>
</button>

<button id="bookChoice" class="choice-card">
<span><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
<h3>Book</h3>
<p>Review a book</p>
</button>

<button id="folderChoice" class="choice-card">
<span><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>
<h3>Folder</h3>
<p>Create a collection</p>
</button>

</div>

</div>

</div>

<!-- MOVIE MODAL -->

<div id="modal" class="modal hidden">

<div class="modal-box glass">

<h2>Add movie</h2>

<input id="titleInput" type="text" placeholder="Title">

<!-- TMDB POSTER PREVIEW -->
<img id="moviePosterPreview" class="api-preview hidden" src="" alt="Poster">

<!-- AUTOMATIC TMDB DATA -->
<input id="genreDisplay" type="text" class="readonly-field" placeholder="Genre (auto-filled only)" readonly>

<input id="directorDisplay" type="text" class="readonly-field" placeholder="Director (auto-filled only)" readonly>

<input id="durationDisplay" type="text" class="readonly-field" placeholder="Duration (auto-filled only)" readonly>

<input id="castDisplay" type="text" class="readonly-field" placeholder="Cast (auto-filled only)" readonly>

<label class="api-hint">Cover (manual, optional if found on TMDB)</label>

<input id="imageInput" type="file" accept="image/*">

<select id="whereInput">
<option value="">Where did you watch it?</option>
<option>Netflix</option>
<option>Prime Video</option>
<option>Disney+</option>
<option>Cinema</option>
<option>Other</option>
</select>

<div class="stars" id="stars"></div>

<textarea id="noteInput" placeholder="Note"></textarea>

<div class="buttons">
<button id="saveBtn">Save</button>
<button id="closeBtn">Close</button>
</div>

</div>

</div>

<!-- SONG MODAL -->

<div id="songModal" class="modal hidden">

<div class="modal-box glass">

<h2>Add song</h2>

<input id="songTitleInput" placeholder="Song title">

<input id="artistInput" placeholder="Artist">

<input id="spotifyInput" placeholder="Spotify link">

<!-- SPOTIFY COVER PREVIEW -->
<img id="songCoverPreview" class="api-preview hidden" src="" alt="Cover">

<div class="stars" id="songStars"></div>

<textarea id="songNoteInput" placeholder="Note"></textarea>

<div class="buttons">
<button id="saveSongBtn">Save</button>
<button id="closeSongBtn">Close</button>
</div>

</div>

</div>

<!-- BOOK MODAL -->

<div id="bookModal" class="modal hidden">

<div class="modal-box glass">

<h2>Add book</h2>

<input id="bookTitleInput" placeholder="Book title">

<!-- OPEN LIBRARY COVER PREVIEW -->
<img id="bookCoverPreview" class="api-preview hidden" src="" alt="Cover">

<input id="bookAuthorInput" placeholder="Author">

<input id="bookPagesInput" type="number" placeholder="Number of pages">

<div class="stars" id="bookStars"></div>

<textarea id="bookNoteInput" placeholder="Note"></textarea>

<div class="buttons">
<button id="saveBookBtn">Save</button>
<button id="closeBookBtn">Close</button>
</div>

</div>

</div>

<!-- CREATE/EDIT FOLDER MODAL -->

<div id="folderItemsModal" class="modal hidden">

<div class="modal-box glass">

<h2 id="folderModalTitle">New folder</h2>

<input id="folderNameInput" type="text" placeholder="Folder name">

<div id="folderItemsGrid" class="folder-items-grid"></div>

<div class="buttons">
<button id="saveFolderBtn">Save</button>
<button id="closeFolderItemsBtn">Close</button>
</div>

</div>

</div>

<!-- SETTINGS -->

<div id="settingsModal" class="modal hidden">

<div class="modal-box glass settings-box">

<h2>Settings</h2>

<h3>Theme</h3>

<select id="themeSelect">
<option value="dark">Dark</option>
<option value="light">Light</option>
</select>

<h3>Layout</h3>

<select id="layoutSelect">
<option value="grid">Cards</option>
<option value="list">List</option>
</select>

<h3>Sort by</h3>

<select id="sortSelect">
<option value="recent">Newest</option>
<option value="old">Oldest</option>
<option value="voteDesc">Rating ↓</option>
<option value="voteAsc">Rating ↑</option>
<option value="az">A-Z</option>
<option value="za">Z-A</option>
<option value="favorite">Favorites</option>
</select>

<hr>

<button id="exportBtn"><span class="icon-row"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export Backup</span></button>
<input id="importInput" type="file" accept=".json">

<hr>

<button id="privacyBtn">Privacy Policy</button>
<button id="manualBtn">User Guide</button>

<div class="buttons">
<button id="closeSettings">Close</button>
</div>

</div>

</div>

<!-- DETAILS MODAL -->

<div id="detailsModal" class="modal hidden">

    <div class="modal-box glass details-box">

        <button id="closeDetails" class="details-close">×</button>

        <img id="detailsImage" class="details-image" src="" alt="">

        <h2 id="detailsTitle">Title</h2>

        <p id="detailsMeta">Info</p>

        <div class="details-rating">
            <strong id="detailsRating">0/10</strong>
        </div>

        <div id="detailsWhere" class="details-pill">Where</div>

        <div id="detailsNote" class="details-note">No notes</div>

        <div class="details-buttons">
            <button id="detailsFavorite" class="details-action favorite-action">Favorite</button>
            <button id="detailsDelete" class="details-action delete-action">Delete</button>
        </div>

    </div>

</div>

<button id="addMovieBtn" class="floating-add">+</button>

<footer class="footer glass">
<p>© 2026 MyVerse • Created by Matteo Minniti</p>
</footer>

<script src="js/storage.js"></script>
<script src="js/icons.js"></script>
<script src="js/folders.js"></script>
<script src="js/suggestions.js"></script>
<script src="js/stars.js"></script>
<script src="js/sort.js"></script>
<script src="js/settings.js"></script>
<script src="js/backup.js"></script>
<script src="js/ui.js"></script>
<script src="js/modal.js"></script>
<script src="js/api.js"></script>
<script src="js/legal.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>

<script>

const newFolderBtn = document.getElementById("newFolderBtn");

if(newFolderBtn){

    newFolderBtn.onclick = function(){

        sidebar.classList.remove("open");

        if(typeof openFolderCreation === "function"){
            openFolderCreation();
        }

    };

}


if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("service-worker.js");
});
}
</script>

</body>

</html>
